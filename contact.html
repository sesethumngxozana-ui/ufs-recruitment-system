            <h1>Contact <span class="blue-text" >Us</span></h1>
            <p>If you have any questions, suggestions, or just want to say hello, we'd love to hear from you! Please fill out the form below and we'll get back to you as soon as possible.</p>

            <form action="submit-contact.php" method="post">
                <label for="name">Name:</label><br/>
                <input type="text" id="name" name="name" required><br/><br/>

                <label for="email">Email:</label><br/>
                <input type="email" id="email" name="email" required><br/><br/>

                <label for="message">Message:</label><br/>
                <textarea id="message" name="message" rows="5" required></textarea><br/><br/>

                <button type="submit">Send Message</button>
            </form>

            <button class="regular-btn">Unstyled Button</button>
            <button class="round-btn">Round Button</button>

            </a>
            </div>
